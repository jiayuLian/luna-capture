name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid
          ldid -v || true

      - name: Install Theos + iOS SDK
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive -q https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -sL -o sdk.tar.xz https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf sdk.tar.xz
          rm -f sdk.tar.xz
          ls -d *.sdk

      - name: Build
        run: |
          set -o pipefail
          make clean || true
          make -j4 FINALPACKAGE=1 2>&1 | tail -80

      - name: Collect and verify
        run: |
          F=$(find . -name 'luna_capture.dylib' -not -path '*.dSYM/*' | head -1)
          echo "found: $F"
          test -n "$F" || { echo "no dylib produced"; exit 1; }
          mkdir -p dist
          cp "$F" dist/luna_capture.dylib
          file dist/luna_capture.dylib
          lipo -info dist/luna_capture.dylib
          echo "--- linkage ---"
          otool -L dist/luna_capture.dylib
          if otool -L dist/luna_capture.dylib | grep -qi substrate; then
            echo "FAIL: substrate dependency leaked"; exit 1
          fi
          echo "--- version marker ---"
          strings dist/luna_capture.dylib | grep -F "v3.7.0" || { echo "FAIL: no version marker"; exit 1; }
          echo "--- channels ---"
          strings dist/luna_capture.dylib | grep -F "TTHttpTask" >/dev/null || { echo "FAIL: no ttnet class"; exit 1; }
          strings dist/luna_capture.dylib | grep -F "didReceiveData" >/dev/null || { echo "FAIL: no session delegate"; exit 1; }
          strings dist/luna_capture.dylib | grep -F "SSL_write" >/dev/null || { echo "FAIL: no ssl hook"; exit 1; }
          strings dist/luna_capture.dylib | grep -F "BDUGLuckyDogNetworkManager" >/dev/null || { echo "FAIL: no auto channel"; exit 1; }
          strings dist/luna_capture.dylib | grep -F "lc_auto.txt" >/dev/null || { echo "FAIL: no auto log"; exit 1; }
          strings dist/luna_capture.dylib | grep -F "BDUGLuckyADRewardedVideoXBridge" >/dev/null || { echo "FAIL: no ad bridge"; exit 1; }
          strings dist/luna_capture.dylib | grep -F "BecomeEffective" >/dev/null || { echo "FAIL: no effective hook"; exit 1; }
          strings dist/luna_capture.dylib | grep -F "didClickCloseWithInfo" >/dev/null || { echo "FAIL: no close hook"; exit 1; }
          strings dist/luna_capture.dylib | grep -F "music_incentive_ad" >/dev/null || { echo "FAIL: no token refresh"; exit 1; }
          # 中文字符串在 Mach-O 里是 UTF-16，strings 搜不到；用 ASCII 符号名做断言
          nm -gU dist/luna_capture.dylib 2>/dev/null | grep -F "LCDumpAdViewTree" >/dev/null || { echo "FAIL: no view tree dump"; exit 1; }
          nm -gU dist/luna_capture.dylib 2>/dev/null | grep -F "LCAutoDuration" >/dev/null || { echo "FAIL: no duration task"; exit 1; }
          nm -gU dist/luna_capture.dylib 2>/dev/null | grep -F "LCAdCleanupStuck" >/dev/null || { echo "FAIL: no stuck cleanup"; exit 1; }
          echo "channels ok"
          echo "--- size ---"
          ls -l dist/luna_capture.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: luna_capture
          path: dist/luna_capture.dylib
          if-no-files-found: error
